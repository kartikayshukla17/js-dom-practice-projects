<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 25%, #f093fb 50%, #4facfe 75%, #00f2fe 100%);
            min-height: 100vh;
            padding: 40px 20px;
            font-family: 'Press Start 2P', cursive;
            position: relative;
            overflow-x: hidden;
        }
        
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                repeating-linear-gradient(
                    0deg,
                    rgba(255, 255, 255, 0.03) 0px,
                    transparent 1px,
                    transparent 2px,
                    rgba(255, 255, 255, 0.03) 3px
                );
            pointer-events: none;
            z-index: 1;
        }
        
        h1 {
            text-align: center;
            color: #fff;
            text-shadow: 
                3px 3px 0 #ff006e,
                6px 6px 0 #8338ec,
                9px 9px 0 #3a86ff;
            font-size: 28px;
            margin-bottom: 40px;
            letter-spacing: 2px;
            animation: float 3s ease-in-out infinite;
            position: relative;
            z-index: 2;
        }
        
        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
        }
        
        .controls {
            max-width: 900px;
            margin: 0 auto 30px;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            border: 4px solid #fff;
            box-shadow: 
                8px 8px 0 rgba(255, 0, 110, 0.5),
                16px 16px 0 rgba(131, 56, 236, 0.3);
            padding: 30px;
            border-radius: 0;
            position: relative;
            z-index: 2;
        }
        
        .input-group {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            justify-content: center;
            align-items: stretch;
        }
        
        input[type="text"],
        input[type="number"],
        select {
            flex: 1;
            min-width: 200px;
            padding: 15px 20px;
            border: 4px solid #fff;
            background: rgba(255, 255, 255, 0.9);
            font-family: 'Press Start 2P', cursive;
            font-size: 10px;
            color: #333;
            box-shadow: 
                4px 4px 0 #ff006e,
                8px 8px 0 #8338ec;
            transition: all 0.3s ease;
            cursor: pointer;
        }
        
        input[type="text"]:focus,
        input[type="number"]:focus,
        select:focus {
            outline: none;
            transform: translate(-2px, -2px);
            box-shadow: 
                6px 6px 0 #ff006e,
                12px 12px 0 #8338ec;
        }
        
        input[type="color"] {
            width: 80px;
            height: 60px;
            border: 4px solid #fff;
            background: #fff;
            cursor: pointer;
            box-shadow: 
                4px 4px 0 #ff006e,
                8px 8px 0 #8338ec;
            transition: all 0.3s ease;
        }
        
        input[type="color"]:hover {
            transform: translate(-2px, -2px);
            box-shadow: 
                6px 6px 0 #ff006e,
                12px 12px 0 #8338ec;
        }
        
        button {
            padding: 15px 30px;
            border: 4px solid #fff;
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: #fff;
            font-family: 'Press Start 2P', cursive;
            font-size: 12px;
            cursor: pointer;
            box-shadow: 
                4px 4px 0 #ff006e,
                8px 8px 0 #8338ec;
            transition: all 0.2s ease;
            text-transform: uppercase;
        }
        
        button:hover {
            transform: translate(-2px, -2px);
            box-shadow: 
                6px 6px 0 #ff006e,
                12px 12px 0 #8338ec;
        }
        
        button:active {
            transform: translate(2px, 2px);
            box-shadow: 
                2px 2px 0 #ff006e,
                4px 4px 0 #8338ec;
        }
        
        #clear {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
        }
        
        .container {
            width: 100%;
            max-width: 900px;
            min-height: 700px;
            background: 
                linear-gradient(45deg, #ffd700 25%, transparent 25%),
                linear-gradient(-45deg, #ffd700 25%, transparent 25%),
                linear-gradient(45deg, transparent 75%, #ffd700 75%),
                linear-gradient(-45deg, transparent 75%, #ffd700 75%);
            background-size: 20px 20px;
            background-position: 0 0, 0 10px, 10px -10px, -10px 0px;
            background-color: #ff6b9d;
            margin: 0 auto;
            padding: 20px;
            border: 6px solid #fff;
            box-shadow: 
                10px 10px 0 rgba(255, 0, 110, 0.6),
                20px 20px 0 rgba(131, 56, 236, 0.4),
                30px 30px 0 rgba(58, 134, 255, 0.2);
            position: relative;
            z-index: 2;
            animation: pulse-border 2s ease-in-out infinite;
        }
        
        @keyframes pulse-border {
            0%, 100% { border-color: #fff; }
            50% { border-color: #00f2fe; }
        }
        
        .circle {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            margin: 10px;
            display: inline-block;
            border: 3px solid #fff;
            box-shadow: 
                0 0 20px rgba(255, 255, 255, 0.5),
                inset 0 0 20px rgba(0, 0, 0, 0.2);
            animation: rotate-3d 3s ease-in-out infinite;
        }
        
        @keyframes rotate-3d {
            0%, 100% { transform: rotateY(0deg) scale(1); }
            50% { transform: rotateY(180deg) scale(1.1); }
        }
        
        .square {
            width: 100px;
            height: 100px;
            margin: 10px;
            display: inline-block;
            border: 3px solid #fff;
            box-shadow: 
                0 0 20px rgba(255, 255, 255, 0.5),
                inset 0 0 20px rgba(0, 0, 0, 0.2);
            animation: spin-square 4s linear infinite;
        }
        
        @keyframes spin-square {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .rectangle {
            width: 100px;
            height: 60px;
            margin: 10px;
            display: inline-block;
            border: 3px solid #fff;
            box-shadow: 
                0 0 20px rgba(255, 255, 255, 0.5),
                inset 0 0 20px rgba(0, 0, 0, 0.2);
            animation: skew-dance 2s ease-in-out infinite;
        }
        
        @keyframes skew-dance {
            0%, 100% { transform: skewX(0deg); }
            25% { transform: skewX(10deg); }
            75% { transform: skewX(-10deg); }
        }
        
        ::placeholder {
            color: #999;
            opacity: 1;
        }
    </style>
</head>
<body>
    <h1>✨ SHAPE MAKER ✨</h1>
    
    <div class="controls">
        <div class="input-group">
            <select id="shapename">
                <option value="">Select Shape</option>
                <option value="circle">Circle</option>
                <option value="square">Square</option>
                <option value="rectangle">Rectangle</option>
            </select>
            <input type="number" name="quantity" id="quantity" placeholder="quantity">
            <input type="color" name="shapename" id="shapecolor" value="#ff006e">
            <button id="generate">GO!</button>
            <button id="clear">CLEAR</button>
        </div>
    </div>

    <div class="container"></div>
    
    <script>
        let generate=document.querySelector("#generate");
        generate.addEventListener("click",()=>{
            let shapename=document.querySelector("#shapename").value;
            let quantity=document.querySelector("#quantity").value;
            let shapecolor=document.querySelector("#shapecolor").value;
            let container=document.querySelector(".container");
            for(let i=0;i<quantity;i++){
                let shape=document.createElement("div");
                shape.classList.add(shapename);
                shape.style.backgroundColor=shapecolor;
                container.appendChild(shape);
            };
            let clear=document.querySelector("#clear");
            clear.addEventListener("click",()=>{
                container.innerHTML=" ";
            })
        });
    </script>
</body>
</html>
