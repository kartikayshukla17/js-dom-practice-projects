<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitHub Finder - Retro Edition</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Press Start 2P', cursive;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 25%, #f093fb 50%, #4facfe 75%, #00f2fe 100%);
            background-size: 400% 400%;
            animation: gradientShift 15s ease infinite;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
            overflow: hidden;
        }
        
        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: 
                repeating-linear-gradient(
                    0deg,
                    rgba(255, 0, 255, 0.1) 0px,
                    transparent 1px,
                    transparent 2px,
                    rgba(255, 0, 255, 0.1) 3px
                );
            pointer-events: none;
            animation: scanlines 8s linear infinite;
        }
        
        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        
        @keyframes scanlines {
            0% { transform: translateY(0); }
            100% { transform: translateY(10px); }
        }
        
        @keyframes neon-glow {
            0%, 100% { 
                box-shadow: 0 0 5px #ff00ff, 0 0 10px #ff00ff, 0 0 20px #ff00ff, 0 0 40px #ff00ff;
            }
            50% { 
                box-shadow: 0 0 10px #00ffff, 0 0 20px #00ffff, 0 0 30px #00ffff, 0 0 60px #00ffff;
            }
        }
        
        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-20px); }
        }
        
        .container {
            background: rgba(0, 0, 0, 0.8);
            border: 4px solid #ff00ff;
            border-radius: 0;
            padding: 40px;
            max-width: 500px;
            width: 100%;
            box-shadow: 0 0 20px #ff00ff, 0 0 40px #00ffff, inset 0 0 20px rgba(255, 0, 255, 0.2);
            animation: neon-glow 2s ease-in-out infinite;
            position: relative;
            z-index: 1;
        }
        
        h1 {
            color: #00ffff;
            text-align: center;
            margin-bottom: 30px;
            font-size: 1.2rem;
            text-shadow: 0 0 10px #00ffff, 0 0 20px #00ffff, 0 0 30px #00ffff;
            animation: float 3s ease-in-out infinite;
        }
        
        .input-group {
            margin-bottom: 30px;
        }
        
        input {
            width: 100%;
            padding: 15px;
            background: #000;
            border: 3px solid #00ffff;
            color: #00ff00;
            font-family: 'Press Start 2P', cursive;
            font-size: 0.7rem;
            outline: none;
            transition: all 0.3s;
            box-shadow: inset 0 0 10px rgba(0, 255, 255, 0.3);
        }
        
        input:focus {
            border-color: #ff00ff;
            box-shadow: 0 0 15px #ff00ff, inset 0 0 10px rgba(255, 0, 255, 0.3);
        }
        
        input::placeholder {
            color: #00ff00;
            opacity: 0.6;
        }
        
        button {
            width: 100%;
            padding: 15px;
            background: linear-gradient(45deg, #ff00ff, #00ffff);
            border: 3px solid #ffff00;
            color: #000;
            font-family: 'Press Start 2P', cursive;
            font-size: 0.8rem;
            cursor: pointer;
            transition: all 0.3s;
            text-transform: uppercase;
            position: relative;
            overflow: hidden;
            box-shadow: 0 0 20px #ffff00;
        }
        
        button:hover {
            transform: scale(1.05);
            box-shadow: 0 0 30px #ffff00, 0 0 50px #ff00ff;
        }
        
        button:active {
            transform: scale(0.95);
        }
        
        button::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(45deg, transparent, rgba(255, 255, 255, 0.3), transparent);
            transform: rotate(45deg);
            animation: shine 3s infinite;
        }
        
        @keyframes shine {
            0% { transform: translateX(-100%) translateY(-100%) rotate(45deg); }
            100% { transform: translateX(100%) translateY(100%) rotate(45deg); }
        }
        
        img {
            display: block;
            margin: 30px auto;
            max-width: 200px;
            border: 5px solid #ff00ff;
            border-radius: 50%;
            box-shadow: 0 0 30px #ff00ff, 0 0 50px #00ffff;
            animation: float 4s ease-in-out infinite;
        }
        
        p {
            color: #ffff00;
            text-align: center;
            line-height: 1.8;
            font-size: 0.7rem;
            text-shadow: 0 0 10px #ffff00;
            margin-top: 20px;
            padding: 20px;
            background: rgba(255, 255, 0, 0.1);
            border: 2px solid #ffff00;
        }
        
        .result-container {
            margin-top: 30px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎮 GITHUB FINDER 🎮</h1>
        <div class="input-group">
            <input type="text" id="username" name="username" placeholder="Enter Username">
        </div>
        <button id="find">Find User</button>
        <div class="result-container" id="results"></div>
    </div>
    
    <script>
        const find=document.querySelector("#find");

        find.addEventListener("click",async ()=>{
            const username=document.querySelector("#username").value;
            try{
                const endpoint=document.querySelector("#username");
                const response= await fetch(`https://api.github.com/users/${username}`);
                if(!response.ok){
                    return alert("something went wrong");
                }
                const data=await response.json();
                
                // Clear previous results
                document.getElementById("results").innerHTML = "";
                
                const img=document.createElement("img");
                img.setAttribute("src",data.avatar_url);
                document.getElementById("results").appendChild(img);
                const bio=document.createElement("p");
                bio.innerText=data.bio;
                document.getElementById("results").appendChild(bio);
            } catch(err){
                console.log(err);
            }
        })
    </script>
</body>
</html>
