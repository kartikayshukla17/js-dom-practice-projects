<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container{
            width: 900px;
            height: 700px;
            background-color: bisque;
            margin-top: 10px;
        }
        .circle{
            width: 100px;
            height: 100px;
            border-radius: 50%;
            margin:10px;
            display: inline-block;
        }
        .square{
            width: 100px;
            height: 100px;
            margin: 10px;
            display: inline-block;
        }
        .rectangle{
            width: 100px;
            height: 60px;
            margin: 10px;
            display: inline-block;
        }
    </style>
</head>
<body>
    <input type="text" name="shapename" id="shapename" placeholder="which shape do you want">
    <input type="number" name="quantity" id="quantity" placeholder="how many shapes">
    <input type="color" name="shapename" id="shapecolor">
    <button id="generate">Generate</button>
    <button id="clear">Clear</button>

    <div class="container">

    </div>
    <script>
        let generate=document.querySelector("#generate");
        generate.addEventListener("click",()=>{
            let shapename=document.querySelector("#shapename").value;
            let quantity=document.querySelector("#quantity").value;
            let shapecolor=document.querySelector("#shapecolor").value;
            let container=document.querySelector(".container");
            for(let i=0;i<quantity;i++){
                let shape=document.createElement("div");
                shape.classList.add(shapename);
                shape.style.backgroundColor=shapecolor;
                container.appendChild(shape);
            };
            let clear=document.querySelector("#clear");
            clear.addEventListener("click",()=>{
                container.innerHTML=" ";
            })
        });
    </script>
</body>
</html>
